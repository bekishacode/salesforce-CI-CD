name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate                 # selected as the required check in section 8
    runs-on: ubuntu-latest
    env:
      SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # the delta needs git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22         # Salesforce CLI crashes on Node 20
      - name: Install Salesforce CLI and sfdx-git-delta
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta
      - name: Log in to the org
        run: |
          if [ -z "$SF_AUTH_URL" ]; then echo "Secret SF_AUTH_URL is not set"; exit 1; fi
          echo "$SF_AUTH_URL" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias target
          rm -f auth.txt
      - name: Validate only what changed (dry run, nothing changes in the org)
        run: bash scripts/ci/deploy-delta.sh "origin/$BASE" validate
